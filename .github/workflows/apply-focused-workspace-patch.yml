name: Apply focused discovery workspace patch
on:
  push:
    branches: [feat/discovery-focused-workspace-v0161]
    paths: [.github/workflows/apply-focused-workspace-patch.yml]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discovery-focused-workspace-v0161
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply focused-workspace changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # API: focused discovery jobs get an explicit workspace state.
          replace_once(
              "apps/api/src/routes/jobs.ts",
              'const JobWorkspaceStatusSchema = z.object({ status: z.enum(["SCORED", "NOT_PURSUING"]) });',
              'const JobWorkspaceStatusSchema = z.object({ status: z.enum(["SCORED", "FOCUSED", "NOT_PURSUING"]) });'
          )

          # Discovery result payload tells the UI whether a job already belongs to the focused workspace.
          replace_once(
              "apps/api/src/services/discovery.ts",
              'SELECT j.*,j.source_url AS sourceUrl,j.salary_text AS salaryText,j.score_kind AS scoreKind,j.analysis_status AS analysisStatus FROM jobs j ',
              'SELECT j.*,j.source_url AS sourceUrl,j.salary_text AS salaryText,j.score_kind AS scoreKind,j.analysis_status AS analysisStatus, CASE WHEN j.origin<>\'discovery\' OR j.status IN (\'FOCUSED\',\'NOT_PURSUING\') OR EXISTS (SELECT 1 FROM applications a WHERE a.job_id=j.id) THEN 1 ELSE 0 END AS inWorkspace FROM jobs j '
          )
          replace_once(
              "apps/api/src/services/discovery.ts",
              'analysisStatus:row.analysisStatus,preScore:',
              'analysisStatus:row.analysisStatus,inWorkspace:Boolean(row.inWorkspace),preScore:'
          )

          # Dashboard: show only jobs intentionally promoted/imported/actioned, not the whole discovery inbox.
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              'import { API_BASE, api } from "../lib/api";',
              'import { API_BASE, api } from "../lib/api";\nimport { navigate } from "../lib/navigation";'
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              '  const organizedJobs = useMemo(() => jobs.map((job) => {',
              '''  const workspaceJobs = useMemo(() => jobs.filter((job) => {
    const hasApplication = applications.some((item) => item.jobId === job.id);
    return job.origin !== "discovery" || job.status === "FOCUSED" || job.status === "NOT_PURSUING" || hasApplication;
  }), [jobs, applications]);

  const organizedJobs = useMemo(() => workspaceJobs.map((job) => {'''
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              '  }), [jobs, applications, trackerByJobId]);',
              '  }), [workspaceJobs, applications, trackerByJobId]);'
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              'async function setWorkspaceStatus(jobId: number, status: "SCORED" | "NOT_PURSUING")',
              'async function setWorkspaceStatus(jobId: number, status: "SCORED" | "FOCUSED" | "NOT_PURSUING")'
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              '      await setWorkspaceStatus(job.id, "SCORED");',
              '      await setWorkspaceStatus(job.id, job.origin === "discovery" ? "FOCUSED" : "SCORED");'
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              '    ? "No active opportunities. New discoveries and restored jobs will appear here."',
              '    ? "No focused opportunities yet. Move promising jobs from Discover, or import a specific employer posting."'
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              '<p>Paste an employer job URL. ApplyLite reads the posting locally, separates required from preferred criteria, and scores it against your factual CV memory.</p>',
              '<p>Your focused application workspace. Jobs only appear here after you move them from Discover, import them directly, or begin an application.</p>'
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              '''      </header>

      {error && <div className="alert">{error}</div>}''',
              '''      </header>

      <section className="panel">
        <div className="panel-title">
          <div><span className="eyebrow">HOW THE PIPELINE WORKS</span><h2>Discover broadly, act selectively</h2></div>
          <button onClick={() => navigate("/discover")}>Browse discovery</button>
        </div>
        <div className="stats-grid">
          <article><span>1 · Discover</span><strong>Browse broadly</strong><small>Discovery can hold many low- and high-score jobs without crowding this workspace.</small></article>
          <article><span>2 · Focus</span><strong>Move promising jobs here</strong><small>Use “Move to Dashboard” only for roles you may actually pursue.</small></article>
          <article><span>3 · Prepare</span><strong>Generate your package</strong><small>Create the tailored CV and cover letter, then review the evidence audit.</small></article>
          <article><span>4 · Apply</span><strong>Use assisted filling</strong><small>Open the employer form, let ApplyLite help fill it, and personally review and submit.</small></article>
        </div>
      </section>

      {error && <div className="alert">{error}</div>}'''
          )
          replace_once(
              "apps/web/src/pages/DashboardPage.tsx",
              '<article><span>All jobs</span><strong>{stats.jobs}</strong></article>',
              '<article><span>Focused jobs</span><strong>{stats.jobs}</strong></article>'
          )

          # Discover: remain a broad inbox and promote jobs explicitly to Dashboard.
          replace_once(
              "apps/web/src/pages/DiscoverPage.tsx",
              'type ResultJob = { id:number;title:string;company:string;location:string;sourceUrl:string;description:string;score:number;scoreKind:string;analysisStatus:string;stale:boolean;scoreBreakdown:ScoreBreakdown;requirements:{workplaceType:string} };',
              'type ResultJob = { id:number;title:string;company:string;location:string;sourceUrl:string;description:string;score:number;scoreKind:string;analysisStatus:string;inWorkspace:boolean;stale:boolean;scoreBreakdown:ScoreBreakdown;requirements:{workplaceType:string} };'
          )
          replace_once(
              "apps/web/src/pages/DiscoverPage.tsx",
              '  async function deepAnalyze(id:number){try{setDeepTask(await api<Task>(`/discovery/jobs/${id}/analyze`,{method:"POST",body:"{}"}));refresh();}catch(e){setError(e instanceof Error?e.message:"Could not queue deep analysis.");}}',
              '''  async function deepAnalyze(id:number){try{setDeepTask(await api<Task>(`/discovery/jobs/${id}/analyze`,{method:"POST",body:"{}"}));refresh();}catch(e){setError(e instanceof Error?e.message:"Could not queue deep analysis.");}}
  async function moveToDashboard(job:ResultJob){
    if(job.inWorkspace){navigate("/");return;}
    setError("");
    try{
      await api(`/jobs/${job.id}/workspace-status`,{method:"PATCH",body:JSON.stringify({status:"FOCUSED"})});
      setNotice(`${job.title} moved to Dashboard. It is now in your focused workspace for package generation and assisted applying.`);
      refresh();
    }catch(e){setError(e instanceof Error?e.message:"Could not move this job to Dashboard.");}
  }'''
          )
          replace_once(
              "apps/web/src/pages/DiscoverPage.tsx",
              '''    <header className="page-header"><div><span className="eyebrow">EXPLORE, THEN FILTER</span><h1>Discover opportunities</h1><p>Collect broadly, compare against your CV and choose your own score filters. Quick results do not need AI.</p></div><button className="primary" onClick={run} disabled={busy||running||!sources.some(s=>s.enabled)||(!titles.trim()&&!broadIT)}>{running?"Discovery running":"Find jobs now"}</button></header>
    {error&&<div role="alert" className="alert">{error}</div>}''',
              '''    <header className="page-header"><div><span className="eyebrow">DISCOVERY INBOX</span><h1>Discover opportunities</h1><p>Collect broadly, compare against your CV and keep even lower-score possibilities here. Move only promising jobs to the focused Dashboard.</p></div><button className="primary" onClick={run} disabled={busy||running||!sources.some(s=>s.enabled)||(!titles.trim()&&!broadIT)}>{running?"Discovery running":"Find jobs now"}</button></header>
    <section className="panel">
      <div className="panel-title"><div><span className="eyebrow">DISCOVER → DASHBOARD → APPLY</span><h2>This page is your broad job inbox</h2></div><button onClick={()=>navigate("/")}>Open focused Dashboard</button></div>
      <div className="stats-grid">
        <article><span>1 · Discover</span><strong>See the broad market</strong><small>Low scores stay visible so useful possibilities are not silently discarded.</small></article>
        <article><span>2 · Compare</span><strong>Inspect fit and evidence</strong><small>Filter, read the posting and request deep analysis when a job deserves it.</small></article>
        <article><span>3 · Promote</span><strong>Move to Dashboard</strong><small>Promoting is an intentional “I may pursue this” action; it does not apply anywhere.</small></article>
        <article><span>4 · Action</span><strong>Prepare and apply there</strong><small>The Dashboard handles CV/cover-letter packages and assisted form filling.</small></article>
      </div>
    </section>
    {error&&<div role="alert" className="alert">{error}</div>}'''
          )
          replace_once(
              "apps/web/src/pages/DiscoverPage.tsx",
              '<div className="actions"><button disabled={!!deepTask&&taskActive(deepTask)} onClick={()=>deepAnalyze(job.id)}>Deep analyze this job</button><button onClick={()=>navigate("/")}>Open job workspace</button></div>',
              '<div className="actions"><button className="primary" onClick={()=>moveToDashboard(job)}>{job.inWorkspace?"Open in Dashboard":"Move to Dashboard"}</button><button disabled={!!deepTask&&taskActive(deepTask)} onClick={()=>deepAnalyze(job.id)}>Deep analyze this job</button></div>'
          )

          # Browser regression: moving a discovery result explicitly marks it focused.
          replace_once(
              "apps/api/scripts/workflowBrowser.ts",
              'const {cvRoutes}=await import("../src/routes/cv.js");const {profileRoutes}=await import("../src/routes/profile.js");const {onboardingRoutes}=await import("../src/routes/onboarding.js");const {taskRoutes}=await import("../src/routes/tasks.js");const {discoveryRoutes}=await import("../src/routes/discovery.js");',
              'const {cvRoutes}=await import("../src/routes/cv.js");const {profileRoutes}=await import("../src/routes/profile.js");const {onboardingRoutes}=await import("../src/routes/onboarding.js");const {taskRoutes}=await import("../src/routes/tasks.js");const {discoveryRoutes}=await import("../src/routes/discovery.js");const {jobRoutes}=await import("../src/routes/jobs.js");'
          )
          replace_once(
              "apps/api/scripts/workflowBrowser.ts",
              'await api.register(discoveryRoutes,{dependencies:{fetchSource:async()=>{sourceCalls++;await new Promise(r=>setTimeout(r,1600));return [posting("1","Frontend Developer","Build accessible React interfaces and test components for customers."),posting("2","Senior Nurse","Provide nursing care and clinical support to hospital patients. Professional registration required.")];}}});',
              'await api.register(discoveryRoutes,{dependencies:{fetchSource:async()=>{sourceCalls++;await new Promise(r=>setTimeout(r,1600));return [posting("1","Frontend Developer","Build accessible React interfaces and test components for customers."),posting("2","Senior Nurse","Provide nursing care and clinical support to hospital patients. Professional registration required.")];}}});await api.register(jobRoutes);'
          )
          replace_once(
              "apps/api/scripts/workflowBrowser.ts",
              ' await page.getByRole("button",{name:"Clear display filters",exact:true}).click();await page.waitForFunction(()=>document.querySelectorAll(".broad-job-card").length===2);assert.ok((await page.locator(".score-kind").allTextContents()).every(s=>s.includes("Quick score")));await page.screenshot({path:path.join(artifacts,"workflow-discovery.png"),fullPage:true});',
              ' await page.getByRole("button",{name:"Clear display filters",exact:true}).click();await page.waitForFunction(()=>document.querySelectorAll(".broad-job-card").length===2);assert.ok((await page.locator(".score-kind").allTextContents()).every(s=>s.includes("Quick score")));assert.equal(await page.getByRole("button",{name:"Move to Dashboard",exact:true}).count(),2);await page.getByRole("button",{name:"Move to Dashboard",exact:true}).first().click();await page.getByText(/moved to Dashboard/).waitFor();assert.equal((db.prepare("SELECT COUNT(*) AS n FROM jobs WHERE status=\'FOCUSED\'").get() as any).n,1);await page.getByRole("button",{name:"Open in Dashboard",exact:true}).waitFor();await page.screenshot({path:path.join(artifacts,"workflow-discovery.png"),fullPage:true});'
          )
          replace_once(
              "apps/api/scripts/workflowBrowser.ts",
              'console.log("Workflow browser PASS: direct routes/refresh/history, missing-field focus, review/merge, explicit targets, background run after page close, saved task/results, persistent optional filters and quick-score labels.");',
              'console.log("Workflow browser PASS: direct routes/refresh/history, guided CV setup, broad discovery, persistent filters, quick-score labels and explicit promotion to the focused Dashboard.");'
          )

          # Docs and patch version.
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace('**Release candidate: 0.16.0.** This workflow changes how discovery stores results and introduces background tasks. Use the feature branch for testing until its pull request is approved and merged. The normal installer below follows `main`, not this candidate branch.', '**Release candidate: 0.16.1.** Discovery is now the broad inbox and Dashboard is the focused application workspace. The normal installer below follows `main`; this branch is for review until merged.')
          text = text.replace('7. Browse all saved discoveries or this run. Filter by score, title alignment, seniority, location, remote arrangement or analysis status without searching again. Inspect the explanations and original posting before applying.', '7. Browse all saved discoveries or this run. Filter by score, title alignment, seniority, location, remote arrangement or analysis status without searching again. Discovery is intentionally broad and may contain many low-score possibilities.\n8. For a role you may actually pursue, choose **Move to Dashboard**. Discovery keeps the broad market separate from your focused application workspace.\n9. In **Dashboard**, generate/review the tailored CV and cover letter, then open the employer form for assisted filling. ApplyLite never clicks the employer\'s final Submit control.')
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          c = changelog.read_text(encoding="utf-8")
          c = '# 0.16.1 - Discovery inbox and focused application workspace\n\n- Keep broad, potentially low-score discovery results on Discover instead of flooding Dashboard.\n- Add an explicit Move to Dashboard action for jobs the user may actually pursue.\n- Keep direct/manual imports and jobs with existing applications visible in Dashboard.\n- Add Discover → Dashboard → package → assisted-apply guidance in both screens.\n- Preserve existing CV/cover-letter generation, application preparation and manual final-submit safety.\n\n' + c
          changelog.write_text(c, encoding="utf-8")

          for filename in ["package.json","package-lock.json","apps/api/package.json","apps/web/package.json"]:
              p=Path(filename)
              if p.exists():
                  p.write_text(p.read_text(encoding="utf-8").replace('"version": "0.16.0"','"version": "0.16.1"'),encoding="utf-8")
          '@ | python -
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: API regressions
        run: npm test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Focused workspace browser journey
        run: npm run regression:workflow-browser -w @apply-lite/api
      - name: Commit tested patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/jobs.ts apps/api/src/services/discovery.ts apps/web/src/pages/DashboardPage.tsx apps/web/src/pages/DiscoverPage.tsx apps/api/scripts/workflowBrowser.ts README.md CHANGELOG.md package.json package-lock.json apps/api/package.json apps/web/package.json
          git commit -m "Separate broad discovery from focused application workspace"
          git push origin HEAD:feat/discovery-focused-workspace-v0161
