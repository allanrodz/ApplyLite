name: Apply speed and background package patch
on:
  push:
    branches:
      - feat/discovery-focused-workspace-v0161
    paths:
      - .github/workflows/apply-speed-package-patch.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discovery-focused-workspace-v0161
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply speed/package changes
        shell: pwsh
        run: python .github/scripts/apply_speed_package_patch.py
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: API regressions
        run: npm test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Workflow browser journey
        run: npm run regression:workflow-browser -w @apply-lite/api
      - name: Commit tested patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/jobs.ts apps/api/src/services/discovery.ts apps/api/src/services/applicationPrep.ts apps/api/src/routes/applicationPrep.ts apps/api/scripts/performanceWorkflowRegression.ts apps/api/package.json apps/web/src/App.tsx apps/web/src/pages/DashboardPage.tsx apps/web/src/pages/DiscoverPage.tsx apps/web/src/components/PackageNotifications.tsx apps/web/src/styles.css apps/web/package.json package.json package-lock.json README.md CHANGELOG.md
          git commit -m "Speed saved views and background package generation"
          git push origin HEAD:feat/discovery-focused-workspace-v0161
