name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        id: dependencies
        run: npm ci
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | Where-Object { $_.FullName -notmatch 'node_modules|\.git' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: CV, matching and discovery tests
        run: npm test
      - name: Gmail regression (synthetic fixtures)
        run: npm run regression:m10
      - name: Install test browser
        id: browser
        run: npx playwright install chromium
      - name: CV and Profile browser regression
        timeout-minutes: 4
        run: npm run regression:browser -w @apply-lite/api
      - name: Form and recovery regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        timeout-minutes: 4
        run: npm run regression:m9
      - name: Data-preserving updater regression
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 4
        shell: powershell
        run: ./scripts/Test-Update.ps1
      - name: Upload synthetic browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reliability-browser
          path: .test-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
