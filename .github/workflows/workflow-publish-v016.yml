name: Materialize CV discovery milestones
on:
  push:
    branches: [feat/cv-discovery-workflow-v016]
    paths: [.github/workflows/workflow-publish-v016.yml]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cv-discovery-workflow-v016
      - name: Verify branch head has not moved
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified milestone source edits
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .maintenance/v016/apply.py
          git push origin HEAD:feat/cv-discovery-workflow-v016
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
